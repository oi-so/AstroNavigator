[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[project]
name = "astronavigator"
version = "0.1.0"
description = "Open-source planetarium and telescope control software."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "astropy>=8.0.1",
    "certifi>=2026.6.17",
    "numpy>=2.5.1",
    "pandas>=3.0.5",
    "pyserial>=3.5",
    "pyside6>=6.11.1",
    "skyfield>=1.55",
    "tzdata>=2026.3",
]


[project.scripts]
astronavigator = "astronavigator.__main__:main"

[dependency-groups]
dev = [
    "line-profiler>=5.0.2",
    "mypy>=2.3.0",
    "pytest>=9.1.1",
    "ruff>=0.15.21",
]


[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
