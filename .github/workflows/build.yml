
name: Build AstroNavigator

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-26
            platform: macos-arm64
            artifact: AstroNavigator-macos-arm64
          - os: windows-2025
            platform: windows-x64
            artifact: AstroNavigator-windows-x64

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Setup Python
        run: |
          uv python install 3.12
          uv sync --frozen --all-groups

      - name: Setup MSVC
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      
      - name: Prepare deployment config (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          uv run python - <<'PY'
          import configparser
          import sys

          path = "pysidedeploy.spec"
          config = configparser.ConfigParser(interpolation=None)
          config.read(path)

          config["python"]["python_path"] = sys.executable

          with open(path, "w") as f:
              config.write(f)
          PY

      - name: Prepare deployment config (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $script = @'
          import configparser
          import sys

          path = "pysidedeploy.spec"
          config = configparser.ConfigParser(interpolation=None)
          config.read(path)

          config["python"]["python_path"] = sys.executable

          plugins = config["qt"]["plugins"].split(",")
          plugins = [
              p for p in plugins
              if p.strip() != "platforms/darwin"
          ]
          config["qt"]["plugins"] = ",".join(plugins)

          with open(path, "w") as f:
              config.write(f)
          '@

          $script | uv run python -


      - name: Build application
        run: |
          uv run pyside6-deploy `
            --config-file pysidedeploy.spec `
            --force
        shell: pwsh
        if: runner.os == 'Windows'

      - name: Build application (macOS)
        if: runner.os == 'macOS'
        run: |
          uv run pyside6-deploy \
            --config-file pysidedeploy.spec \
            --force

      - name: Verify Windows build
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $exe = "dist/AstroNavigator.dist/AstroNavigator.exe"
          if (-not (Test-Path $exe)) {
            throw "Build failed: $exe was not created."
          }

      - name: Package macOS
        if: runner.os == 'macOS'
        run: |
          ditto -c -k --sequesterRsrc --keepParent \
            dist/AstroNavigator.app \
            AstroNavigator-macos-arm64.zip

      - name: Package Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Compress-Archive `
            -Path dist/AstroNavigator.dist `
            -DestinationPath AstroNavigator-windows-x64.zip `
            -Force

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: AstroNavigator-*.zip
          if-no-files-found: error

  release:
    name: Create GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest

    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: AstroNavigator-*
          path: release-assets
          merge-multiple: true

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: release-assets/*.zip
          generate_release_notes: true
